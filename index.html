<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Charger Cluster</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root {
    --g: min(82vh, 33vw);          /* big gauge size */
    --s: calc(var(--g) * .55);     /* small gauge size */
    --mark: #141516;               /* black dial markings */
    --ink: #f4f6f8;
    --sub: #9aa3ad;
    --dim: #5b636c;
    --off: #0c0e11;
    --needle: #e3211b;
    --green: #2bff6a;
    --blue: #3f8cff;
    --amber: #ffae1a;
    --red: #ff2a1f;
    --evic: #bfe6ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #000; color: var(--ink);
    font-family: Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  .app {
    height: 100vh; height: 100dvh; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse 70% 60% at 50% 45%, #121417 0%, #050607 70%, #000 100%);
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .dim1 .cluster { filter: brightness(.6); }
  .dim2 .cluster { filter: brightness(.35); }

  .cluster { display: flex; align-items: center; justify-content: center; }
  .big   { width: var(--g); height: var(--g); position: relative; z-index: 2; flex-shrink: 0; margin: 0 calc(var(--g) * .005); }
  .small { width: var(--s); height: var(--s); position: relative; z-index: 1; flex-shrink: 0; transform: translateY(-24%); }
  .small.l { margin-right: calc(var(--g) * -.07); }
  .small.r { margin-left:  calc(var(--g) * -.07); }
  .big > svg, .small > svg { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* SVG gauge parts: black markings on a satin-silver face, like the factory cluster */
  .num   { fill: var(--mark); font-weight: 700; text-anchor: middle; dominant-baseline: central; font-size: 15px; }
  .num.s { font-size: 14px; }
  .num.m { font-size: 11px; }
  .subn  { fill: #4a4e52; font-weight: 600; text-anchor: middle; dominant-baseline: central; font-size: 7px; }
  .lbl   { fill: var(--mark); text-anchor: middle; font-weight: 700; font-size: 11px; }
  .lbl2  { fill: #33373b; text-anchor: middle; font-weight: 600; font-size: 7px; letter-spacing: .04em; }
  .maj   { stroke: var(--mark); stroke-width: 2.8; }
  .mid   { stroke: var(--mark); stroke-width: 1.8; }
  .min   { stroke: var(--mark); stroke-width: 1.1; }
  .needle { transition: opacity .3s; }
  .nodata .needle { opacity: .3; }
  .nd    { fill: #6a6f74; font-size: 7px; text-anchor: middle; letter-spacing: .1em; font-weight: 700; display: none; }
  .nodata .nd { display: block; }

  /* The black lower part of each big gauge holds the displays, like the factory LCDs */
  .seg { position: absolute; left: 22%; right: 22%; top: 69.5%; height: 22%; display: flex; flex-direction: column; align-items: center; justify-content: center; }

  /* Telltales (in the tachometer's black area) */
  .tt { display: flex; gap: calc(var(--g) * .016); }
  .light { width: calc(var(--g) * .058); height: calc(var(--g) * .058); color: #121416; }
  .light svg { width: 100%; height: 100%; fill: currentColor; }
  .light.on.green { color: var(--green); filter: drop-shadow(0 0 4px var(--green)); }
  .light.on.blue  { color: var(--blue);  filter: drop-shadow(0 0 4px var(--blue)); }
  .light.on.amber { color: var(--amber); filter: drop-shadow(0 0 4px var(--amber)); }
  .light.on.red   { color: var(--red);   filter: drop-shadow(0 0 4px var(--red)); }
  .clockrow { margin-top: calc(var(--g) * .02); font-family: "Roboto Mono", ui-monospace, monospace; color: var(--evic);
              font-size: calc(var(--g) * .042); text-shadow: 0 0 4px rgba(120,200,255,.45); display: flex; gap: .6em; align-items: center; }

  /* EVIC / odometer LCD (in the speedometer's black area) */
  .evic { cursor: pointer; font-family: "Roboto Mono", ui-monospace, Menlo, monospace; color: var(--evic);
          text-shadow: 0 0 4px rgba(120,200,255,.45); text-align: center; }
  .evic .spd { font-size: calc(var(--g) * .088); font-weight: 700; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .evic .spd small { font-size: .38em; margin-left: 3px; font-weight: 600; }
  .evic .ln { font-size: calc(var(--g) * .034); line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .evic .ln.msg { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .evic .ln.err { color: #ffb4a8; text-shadow: 0 0 4px rgba(255,90,60,.5); }
  .dot { display: inline-block; width: .7em; height: .7em; border-radius: 50%; background: #333; }
  .dot.ok { background: var(--green); box-shadow: 0 0 4px var(--green); }
  .dot.wait { background: var(--amber); }

  .menu-btn {
    position: fixed; right: calc(10px + env(safe-area-inset-right)); bottom: calc(8px + env(safe-area-inset-bottom));
    background: transparent; color: #4a525b; border: 1px solid #1f252b; border-radius: 8px;
    font: 600 12px/1 Roboto, sans-serif; letter-spacing: .12em; padding: 8px 12px; z-index: 5;
  }

  /* Menus */
  .sheet { position: fixed; inset: 0; background: rgba(0,0,0,.8); display: none; align-items: center; justify-content: center; z-index: 10; }
  .sheet.open { display: flex; }
  .panel { background: #0c1014; border: 1px solid #262d35; border-radius: 14px; padding: 14px; width: min(560px, calc(100vw - 32px)); max-height: 92vh; overflow: auto; }
  .panel h2 { margin: 2px 0 8px; font-size: 15px; letter-spacing: .06em; color: var(--sub); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .panel button {
    display: block; width: 100%; text-align: left; padding: 11px 12px; border-radius: 10px;
    background: #121820; color: var(--ink); border: 1px solid #252d36; font: 15px Roboto, sans-serif;
  }
  .panel button small { display: block; color: var(--sub); font-size: 12px; margin-top: 3px; }
  .panel button:disabled { opacity: .4; }
  .panel button.wide { grid-column: span 2; text-align: center; }
  pre.log { background: #000; color: #9fd3ff; font: 11px/1.35 ui-monospace, monospace; padding: 8px; height: 55vh; overflow: auto; white-space: pre-wrap; word-break: break-all; border-radius: 8px; margin: 0 0 8px; user-select: text; -webkit-user-select: text; }

  .rotate { position: fixed; inset: 0; background: #000; display: none; align-items: center; justify-content: center; text-align: center; color: var(--sub); font-size: 16px; padding: 24px; z-index: 20; }
  @media (orientation: portrait) and (max-width: 700px) { .rotate { display: flex; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f8fa"/><stop offset=".22" stop-color="#8f969e"/>
      <stop offset=".48" stop-color="#eef1f4"/><stop offset=".72" stop-color="#4f565e"/>
      <stop offset="1" stop-color="#cfd4da"/>
    </linearGradient>
    <radialGradient id="face" cx=".46" cy=".38" r=".7">
      <stop offset="0" stop-color="#f7f8f6"/><stop offset=".55" stop-color="#e3e5e2"/>
      <stop offset=".9" stop-color="#c8cbc9"/><stop offset="1" stop-color="#aeb2b1"/>
    </radialGradient>
    <radialGradient id="cap" cx=".4" cy=".35" r=".8">
      <stop offset="0" stop-color="#f2f3f1"/><stop offset=".7" stop-color="#cfd2d0"/><stop offset="1" stop-color="#9da1a3"/>
    </radialGradient>
    <linearGradient id="needleG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b3120c"/><stop offset=".5" stop-color="#f2332a"/><stop offset="1" stop-color="#b3120c"/>
    </linearGradient>
    <filter id="nshadow" x="-50%" y="-10%" width="200%" height="120%">
      <feDropShadow dx="1.2" dy="1.8" stdDeviation="1.1" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
</svg>

<div class="app" id="app">
  <div class="cluster">
    <div class="small l"><svg id="g-fuel" viewBox="0 0 200 200"></svg></div>
    <div class="big">
      <svg id="g-speed" viewBox="0 0 200 200"></svg>
      <div class="seg evic" id="evic" title="Tap to change page">
        <div class="spd"><span id="e-spd">--</span><small id="e-unit">km/h</small></div>
        <div class="ln" id="e-ln">TAP MENU TO CONNECT</div>
      </div>
    </div>
    <div class="big">
      <svg id="g-tach" viewBox="0 0 200 200"></svg>
      <div class="seg">
        <div class="tt">
          <div class="light green" id="L-left"><svg viewBox="0 0 24 24"><path d="M1 12 10 3v5.5h13v7H10V21z"/></svg></div>
          <div class="light blue" id="L-high"><svg viewBox="0 0 24 24"><path d="M13 4c5 0 9 3.6 9 8s-4 8-9 8z"/><path d="M1 6.5h9v2H1zm0 4.5h9v2H1zm0 4.5h9v2H1z"/></svg></div>
          <div class="light amber" id="L-mil"><svg viewBox="0 0 24 24"><path d="M7 5h7v2h-2v2h3l2 2h2V9h2v8h-2v-2h-2l-2 3H8l-2-2H4v2H2V9h2v2h2V9h4V7H7z"/></svg></div>
          <div class="light red" id="L-batt"><svg viewBox="0 0 24 24"><path d="M5 5h3v2h8V5h3v2h3v13H2V7h3zm-1 4v9h16V9zm1.5 3.5h5v1.6h-5zm8 0h2v-2h1.6v2h2v1.6h-2v2h-1.6v-2h-2z"/></svg></div>
          <div class="light red" id="L-temp"><svg viewBox="0 0 24 24"><path d="M11 2h2.6v11.3a4 4 0 1 1-2.6 0zm4 2h5v1.6h-5zm0 3.5h5v1.6h-5zm0 3.5h5v1.6h-5z"/></svg></div>
          <div class="light green" id="L-right"><svg viewBox="0 0 24 24"><path d="M23 12 14 3v5.5H1v7h13V21z"/></svg></div>
        </div>
        <div class="clockrow"><span id="e-clock">--:--</span><span class="dot" id="e-dot"></span></div>
      </div>
    </div>
    <div class="small r"><svg id="g-temp" viewBox="0 0 200 200"></svg></div>
  </div>
</div>

<button class="menu-btn" id="b-menu">MENU</button>

<div class="sheet" id="menu">
  <div class="panel">
    <h2>CONNECT ADAPTER</h2>
    <div class="grid2">
      <button id="c-serial">Bluetooth Classic<small id="n-serial">Adapter paired in Android Bluetooth settings (PIN 1234 / 0000)</small></button>
      <button id="c-ble">Bluetooth LE / 4.0<small id="n-ble">Adapter that doesn't pair in settings</small></button>
      <button id="c-wifi">Wi-Fi adapter<small>Needs the bridge app on this phone (see guide)</small></button>
      <button id="c-gps">Phone GPS<small>Speed only, no adapter</small></button>
      <button id="c-off" class="wide">Disconnect</button>
    </div>
    <h2 style="margin-top:14px">DISPLAY</h2>
    <div class="grid2">
      <button id="b-units">Units: km/h</button>
      <button id="b-dim">Brightness: Day</button>
      <button id="b-full">Full screen</button>
      <button id="b-log">Connection log</button>
      <button id="b-close" class="wide">Close</button>
    </div>
  </div>
</div>

<div class="sheet" id="logsheet">
  <div class="panel">
    <h2>CONNECTION LOG</h2>
    <pre class="log" id="log"></pre>
    <div class="grid2">
      <button id="b-copy">Copy log</button>
      <button id="b-logclose">Close</button>
    </div>
  </div>
</div>

<div class="rotate">Turn the phone sideways<br>for the dashboard.</div>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  // ---------- Settings, remembered on this phone ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  let units = store.get('units', 'kmh');
  let dim = store.get('dim', 0);
  let page = store.get('page', 0);

  // ---------- Live values from the car. null = not known. No made-up numbers. ----------
  const S = {};
  function clearLive() {
    Object.assign(S, { speed: null, rpm: null, coolant: null, fuel: null, volt: null, throttle: null,
                       load: null, iat: null, mil: false, dtc: null, proto: null });
  }
  clearLive();
  let srcKind = null;    // 'serial' | 'ble' | 'wifi' | 'gps' | null
  let linkState = 'off'; // 'off' | 'wait' | 'ok'
  let message = 'TAP MENU TO CONNECT', messageErr = false;
  function setMsg(text, err = false, state = null) {
    message = text; messageErr = err;
    if (state) linkState = state;
    log('..', text);
  }

  // ---------- Log (for troubleshooting in the car) ----------
  const LOG = [];
  function log(dir, text) {
    const t = new Date().toTimeString().slice(0, 8);
    LOG.push(`${t} ${dir} ${String(text).replace(/\r/g, '⏎')}`);
    if (LOG.length > 400) LOG.splice(0, LOG.length - 400);
    if ($('logsheet').classList.contains('open')) showLog();
  }
  function showLog() { const el = $('log'); el.textContent = LOG.join('\n'); el.scrollTop = el.scrollHeight; }

  // ---------- Gauges ----------
  const NS = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };
  const pt = (r, deg) => { const a = (deg - 90) * Math.PI / 180; return [100 + r * Math.cos(a), 100 + r * Math.sin(a)]; };
  const arcPath = (r, d0, d1) => {
    const [x0, y0] = pt(r, d0), [x1, y1] = pt(r, d1);
    return `M${x0} ${y0}A${r} ${r} 0 ${d1 - d0 > 180 ? 1 : 0} 1 ${x1} ${y1}`;
  };

  class Gauge {
    constructor(svg, opt) { this.svg = svg; this.cur = 0; this.target = 0; this.build(opt); }
    build(o) {
      Object.assign(this, { min: 0, a0: -112, a1: 112, red: null, sub: null, mid: null, small: false,
                            numR: 60, numClass: '', chord: 137, units: [] }, o);
      const s = this.svg; s.innerHTML = '';
      // Chrome trim ring, silver face, and the black lower area where the factory LCDs sit
      el('circle', { cx: 100, cy: 100, r: 98, fill: 'url(#chrome)' }, s);
      el('circle', { cx: 100, cy: 100, r: 92.5, fill: '#060708' }, s);
      el('circle', { cx: 100, cy: 100, r: 91, fill: 'url(#face)' }, s);
      const h = Math.sqrt(91 * 91 - (this.chord - 100) ** 2);
      el('path', { d: `M${100 - h} ${this.chord}A91 91 0 ${this.chord < 100 ? 1 : 0} 0 ${100 + h} ${this.chord}Z`, fill: '#050506' }, s);
      el('circle', { cx: 100, cy: 100, r: 91, fill: 'none', stroke: '#8c9092', 'stroke-width': .8 }, s);
      if (this.red) {
        el('path', { d: arcPath(83, this.ang(this.red[0]), this.ang(this.red[1])), fill: 'none',
                     stroke: '#d81e17', 'stroke-width': 6 }, s);
      }
      const steps = Math.round((this.max - this.min) / this.minor);
      const isMult = (v, m) => m && Math.abs(((v - this.min) / m) - Math.round((v - this.min) / m)) < 1e-6;
      for (let i = 0; i <= steps; i++) {
        const v = this.min + i * this.minor, a = this.ang(v);
        const kind = isMult(v, this.major) ? 'maj' : isMult(v, this.mid) ? 'mid' : 'min';
        const [x0, y0] = pt(kind === 'maj' ? 71 : kind === 'mid' ? 76 : 79, a), [x1, y1] = pt(86, a);
        el('line', { x1: x0, y1: y0, x2: x1, y2: y1, class: kind }, s);
        if (kind === 'maj' && this.label) {
          const txt = this.label(v);
          if (txt !== '') {
            const [tx, ty] = pt(this.small ? 58 : this.numR, a);
            el('text', { x: tx, y: ty, class: 'num' + (this.small ? ' s' : '') + (this.numClass ? ' ' + this.numClass : '') }, s).textContent = txt;
          }
        }
      }
      if (this.sub) {  // second, smaller inner scale (km/h <-> mph), like the factory cluster
        for (let v = this.sub.step; v * this.sub.factor <= this.max + 1e-6; v += this.sub.step) {
          const [tx, ty] = pt(45, this.ang(v * this.sub.factor));
          el('text', { x: tx, y: ty, class: 'subn' }, s).textContent = v;
        }
      }
      this.units.forEach(([text, cls], i) => { el('text', { x: 100, y: 70 + i * 10, class: cls }, s).textContent = text; });
      if (this.icon) {
        const g = el('g', { transform: 'translate(88 128)', fill: '#4b5055' }, s);
        el('path', { d: this.icon }, g);
      }
      el('text', { x: 100, y: this.small ? 165 : 128, class: 'nd' }, s).textContent = 'NO DATA';
      this.needle = el('g', { class: 'needle', filter: 'url(#nshadow)' }, s);
      const tip = this.small ? 26 : 15;
      el('polygon', { points: `97.4,${this.small ? 116 : 120} 102.6,${this.small ? 116 : 120} 101,${tip + 8} 100,${tip} 99,${tip + 8}`, fill: 'url(#needleG)' }, this.needle);
      el('circle', { cx: 100, cy: 100, r: this.small ? 12 : 16, fill: 'url(#cap)', stroke: '#8e9294', 'stroke-width': .8 }, s);
      this.draw();
    }
    ang(v) { const f = (Math.min(Math.max(v, this.min), this.max) - this.min) / (this.max - this.min); return this.a0 + f * (this.a1 - this.a0); }
    draw() { this.needle.setAttribute('transform', `rotate(${this.ang(this.cur)} 100 100)`); }
  }

  const ICON_FUEL = 'M2 2h9v19H2zm2 2v5h5V4zm8 3 1-1 3.5 3.5V18a1 1 0 0 0 2 0v-6.5L17 10V7h1.5l1.5 1.5V18a3 3 0 0 1-6 0V12h-1z';
  const ICON_TEMP = 'M10 1h3v12.5a4.2 4.2 0 1 1-3 0zm5 2h5v1.6h-5zm0 3.5h5v1.6h-5zm0 3.5h5v1.6h-5z';

  const tach = new Gauge($('g-tach'), {
    max: 7000, major: 1000, mid: 500, minor: 250, label: v => v / 1000,
    units: [['RPM', 'lbl'], ['x1000', 'lbl2']]
  });
  const speed = new Gauge($('g-speed'), speedOpts());
  function speedOpts() {
    return units === 'mph'
      ? { max: 150, major: 20, mid: 10, minor: 5, label: v => v, numClass: 'm', numR: 62,
          units: [['MPH', 'lbl'], ['km/h', 'lbl2']], sub: { step: 40, factor: 0.621371 } }
      : { max: 240, major: 20, mid: 10, minor: 5, label: v => v, numClass: 'm', numR: 62,
          units: [['km/h', 'lbl'], ['MPH', 'lbl2']], sub: { step: 20, factor: 1.609344 } };
  }
  const fuel = new Gauge($('g-fuel'), {
    max: 100, major: 25, minor: 12.5, a0: -50, a1: 50, red: [0, 8], small: true, chord: 112,
    label: v => v === 0 ? 'E' : v === 100 ? 'F' : v === 50 ? '½' : '', icon: ICON_FUEL
  });
  const temp = new Gauge($('g-temp'), {
    min: 40, max: 130, major: 45, minor: 22.5, a0: -50, a1: 50, red: [121, 130], small: true, chord: 112,
    label: v => v === 40 ? 'C' : v === 130 ? 'H' : '', icon: ICON_TEMP
  });
  const gauges = [
    { g: tach,  read: () => S.rpm },
    { g: speed, read: () => S.speed === null ? null : (units === 'mph' ? S.speed * 0.621371 : S.speed) },
    { g: fuel,  read: () => S.fuel },
    { g: temp,  read: () => S.coolant },
  ];

  // ---------- Telltales ----------
  const L = { left: $('L-left'), right: $('L-right'), high: $('L-high'), mil: $('L-mil'), batt: $('L-batt'), temp: $('L-temp') };

  // ---------- Animation: factory-style needle sweep + bulb check at start, then live data ----------
  const boot = performance.now();
  const ease = x => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
  function frame(now) {
    const t = now - boot;
    const sweep = t < 900 ? ease(t / 900) : t < 1800 ? ease(1 - (t - 900) / 900) : null;
    for (const { g, read } of gauges) {
      if (sweep !== null) {
        g.target = g.min + (g.max - g.min) * sweep;
        g.svg.classList.remove('nodata');
        g.cur = g.target;
      } else {
        const v = read();
        g.svg.classList.toggle('nodata', v === null);
        g.target = v === null ? g.min : v;
        g.cur += (g.target - g.cur) * 0.2;
      }
      g.draw();
    }
    const bulb = t < 2200;
    // Turn signals and high beam are NOT available through the OBD port: they only light during the bulb check.
    L.left.classList.toggle('on', bulb);
    L.right.classList.toggle('on', bulb);
    L.high.classList.toggle('on', bulb);
    L.mil.classList.toggle('on', bulb || S.mil);
    L.temp.classList.toggle('on', bulb || (S.coolant !== null && S.coolant >= 118));
    L.batt.classList.toggle('on', bulb || (S.volt !== null && ((S.rpm !== null && S.rpm > 500 && S.volt < 12.8) || S.volt > 15.3)));
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---------- EVIC centre display ----------
  const f = (v, d = 0) => v === null || v === undefined || isNaN(v) ? '--' : v.toFixed(d);
  const tempStr = c => c === null ? '--' : units === 'mph' ? `${f(c * 9 / 5 + 32)}°F` : `${f(c)}°C`;
  const PAGES = [
    () => [`BAT ${f(S.volt, 1)}V`, `THR ${f(S.throttle)}%`],
    () => [`CLT ${tempStr(S.coolant)}`, `FUEL ${f(S.fuel)}%`],
    () => [`LOAD ${f(S.load)}%`, `AIR ${tempStr(S.iat)}`],
    () => [`RPM ${S.rpm === null ? '--' : Math.round(S.rpm)}`, `DTC ${S.dtc === null ? '--' : S.dtc}`],
  ];
  function evic() {
    $('e-clock').textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const spd = gauges[1].read();
    $('e-spd').textContent = spd === null ? '--' : Math.round(spd);
    $('e-unit').textContent = units === 'mph' ? 'MPH' : 'km/h';
    const ln = $('e-ln');
    const showMsg = linkState !== 'ok' || messageErr;
    ln.textContent = showMsg ? message : PAGES[page % PAGES.length]().join('  ');
    ln.classList.toggle('msg', showMsg);
    ln.classList.toggle('err', messageErr);
    $('e-dot').className = 'dot ' + (linkState === 'ok' ? 'ok' : linkState === 'wait' ? 'wait' : '');
  }
  setInterval(evic, 250); evic();
  $('evic').onclick = () => { page = (page + 1) % PAGES.length; store.set('page', page); evic(); };

  // ---------- ELM327 protocol ----------
  class Elm {
    constructor(t) {
      this.t = t; this.buf = ''; this.wait = null; this.dead = null;
      t.onData(s => { this.buf += s; this.flush(); });
      t.onClose(() => {
        this.dead = new Error('Adapter disconnected');
        if (this.wait) { const w = this.wait; this.wait = null; clearTimeout(w.timer); w.reject(this.dead); }
      });
    }
    flush() {
      const i = this.buf.indexOf('>');
      if (i < 0 || !this.wait) return;
      const reply = this.buf.slice(0, i).replace(/[\r\n]+/g, ' ').trim();
      this.buf = this.buf.slice(i + 1);
      const w = this.wait; this.wait = null; clearTimeout(w.timer);
      log('RX', reply);
      w.resolve(reply);
    }
    send(cmd, ms = 2000) {
      if (this.dead) return Promise.reject(this.dead);
      return new Promise((resolve, reject) => {
        this.buf = '';
        log('TX', cmd);
        const timer = setTimeout(() => {
          this.wait = null; log('--', 'no reply to ' + cmd);
          const e = new Error('No reply to ' + cmd); e.timeout = true; reject(e);
        }, ms);
        this.wait = { resolve, reject, timer };
        Promise.resolve().then(() => this.t.write(cmd + '\r')).catch(err => {
          clearTimeout(timer); this.wait = null; reject(err);
        });
      });
    }
  }

  const hex2 = n => n.toString(16).toUpperCase().padStart(2, '0');
  function pidBytes(reply, pid) {
    const s = reply.replace(/\s/g, '').toUpperCase();
    const i = s.indexOf('41' + hex2(pid));
    if (i < 0) return null;
    const out = [];
    for (let j = i + 4; j + 1 < s.length && out.length < 4; j += 2) {
      const b = parseInt(s.substr(j, 2), 16);
      if (isNaN(b)) break;
      out.push(b);
    }
    return out.length ? out : null;
  }
  function supportedSet(reply, base) {
    const set = new Set();
    const s = reply.replace(/\s/g, '').toUpperCase(), key = '41' + hex2(base);
    for (let i = s.indexOf(key); i >= 0; i = s.indexOf(key, i + 4)) {
      for (let k = 0; k < 4; k++) {
        const b = parseInt(s.substr(i + 4 + k * 2, 2), 16);
        if (isNaN(b)) break;
        for (let bit = 0; bit < 8; bit++) if (b & (0x80 >> bit)) set.add(base + k * 8 + bit + 1);
      }
    }
    return set;
  }
  const notTimeout = e => { if (!e.timeout) throw e; };

  async function runObd(sess, t) {
    const elm = new Elm(t);
    setMsg('WAKING ADAPTER…', false, 'wait');
    try { await elm.send('ATZ', 4000); } catch (e) { notTimeout(e); }
    await sleep(300);
    for (const c of ['ATE0', 'ATL0', 'ATS0', 'ATH0', 'ATAT1', 'ATSP0']) {
      try { await elm.send(c); } catch (e) { notTimeout(e); }
    }
    setMsg('TALKING TO CAR…', false, 'wait');
    let hello;
    try { hello = await elm.send('0100', 12000); }
    catch (e) { notTimeout(e); throw new Error('CAR NOT ANSWERING – IGNITION ON?'); }
    const sup = supportedSet(hello, 0);
    if (!sup.size) throw new Error(/UNABLE|NO ?DATA|ERROR|BUS|STOPPED|CAN/i.test(hello)
      ? 'CAR NOT ANSWERING – IGNITION ON?' : 'ODD REPLY: ' + hello.slice(0, 24));
    if (sup.has(0x20)) {
      try { supportedSet(await elm.send('0120', 3000), 0x20).forEach(x => sup.add(x)); } catch (e) { notTimeout(e); }
    }
    log('..', 'car supports PIDs: ' + [...sup].map(hex2).join(' '));
    try { S.proto = (await elm.send('ATDP')).replace(/^AUTO,?\s*/i, ''); } catch (e) { notTimeout(e); }
    setMsg('CONNECTED' + (S.proto ? ' · ' + S.proto : ''), false, 'ok');

    let misses = 0, n = 0;
    const ask = async (pid, len, fn) => {
      if (!sup.has(pid)) return;
      try {
        const b = pidBytes(await elm.send('01' + hex2(pid)), pid);
        misses = 0;
        if (b && b.length >= len) fn(b);
      } catch (e) {
        notTimeout(e);
        if (++misses > 8) throw new Error('ADAPTER STOPPED ANSWERING');
      }
    };
    while (sess.active) {
      await ask(0x0D, 1, b => { S.speed = b[0]; });
      await ask(0x0C, 2, b => { S.rpm = (b[0] * 256 + b[1]) / 4; });
      if (n % 5 === 0) {
        await ask(0x05, 1, b => { S.coolant = b[0] - 40; });
        await ask(0x11, 1, b => { S.throttle = b[0] * 100 / 255; });
        await ask(0x04, 1, b => { S.load = b[0] * 100 / 255; });
      }
      if (n % 25 === 0) {
        await ask(0x2F, 1, b => { S.fuel = b[0] * 100 / 255; });
        await ask(0x0F, 1, b => { S.iat = b[0] - 40; });
        await ask(0x01, 1, b => { S.mil = (b[0] & 0x80) !== 0; S.dtc = b[0] & 0x7F; });
        try {
          const v = parseFloat((await elm.send('ATRV')).replace(/[^\d.]/g, ''));
          if (!isNaN(v)) S.volt = v;
        } catch (e) { notTimeout(e); }
      }
      n++;
    }
  }

  // ---------- Connections ----------
  const enc = new TextEncoder();

  // Bluetooth LE (Web Bluetooth). Service IDs used by common ELM327 BLE adapters.
  const BLE_SERVICES = [0xfff0, 0xffe0, 0x18f0, 0xae00, 0xae30, 'e7810a71-73ae-499d-8c15-faa9aef0c3f2'];
  async function openBle(dev) {
    setMsg('CONNECTING TO ' + (dev.name || 'ADAPTER').toUpperCase() + '…', false, 'wait');
    const server = await dev.gatt.connect();
    let wr = null, nt = null;
    for (const uuid of BLE_SERVICES) {
      let svc;
      try { svc = await server.getPrimaryService(uuid); } catch { continue; }
      let w = null, n = null;
      for (const c of await svc.getCharacteristics()) {
        log('..', `BLE ${svc.uuid.slice(4, 8)} char ${c.uuid.slice(4, 8)} ${c.properties.notify ? 'N' : ''}${c.properties.write ? 'W' : ''}${c.properties.writeWithoutResponse ? 'w' : ''}`);
        if (!n && (c.properties.notify || c.properties.indicate)) n = c;
        if (!w && (c.properties.write || c.properties.writeWithoutResponse)) w = c;
      }
      if (w && n) { wr = w; nt = n; break; }
    }
    if (!wr) { try { dev.gatt.disconnect(); } catch {} throw new Error('NOT AN OBD ADAPTER (NO SERIAL SERVICE)'); }
    const dec = new TextDecoder();
    let dataCb = () => {}, closeCb = () => {};
    const onVal = e => dataCb(dec.decode(e.target.value));
    const onDisc = () => closeCb();
    nt.addEventListener('characteristicvaluechanged', onVal);
    dev.addEventListener('gattserverdisconnected', onDisc);
    await nt.startNotifications();
    const useNoResp = wr.properties.writeWithoutResponse && !wr.properties.write;
    return {
      write: s => useNoResp ? wr.writeValueWithoutResponse(enc.encode(s)) : wr.writeValue(enc.encode(s)),
      onData: fn => { dataCb = fn; },
      onClose: fn => { closeCb = fn; },
      close: async () => {
        nt.removeEventListener('characteristicvaluechanged', onVal);
        dev.removeEventListener('gattserverdisconnected', onDisc);
        try { dev.gatt.disconnect(); } catch {}
      }
    };
  }

  // Bluetooth Classic (Web Serial over the Bluetooth serial port profile).
  const SPP = '00001101-0000-1000-8000-00805f9b34fb';
  async function openSerial(port) {
    setMsg('OPENING ADAPTER…', false, 'wait');
    await port.open({ baudRate: 38400 });
    const reader = port.readable.getReader(), writer = port.writable.getWriter();
    const dec = new TextDecoder();
    let dataCb = () => {}, closeCb = () => {}, closed = false;
    (async () => {
      try {
        for (;;) {
          const { value, done } = await reader.read();
          if (done) break;
          if (value) dataCb(dec.decode(value, { stream: true }));
        }
      } catch (e) { log('--', 'serial: ' + e.message); }
      if (!closed) { closed = true; closeCb(); }
    })();
    return {
      write: s => writer.write(enc.encode(s)),
      onData: fn => { dataCb = fn; },
      onClose: fn => { closeCb = fn; },
      close: async () => {
        closed = true;
        try { await reader.cancel(); } catch {}
        try { reader.releaseLock(); } catch {}
        try { writer.releaseLock(); } catch {}
        try { await port.close(); } catch {}
      }
    };
  }

  // Wi-Fi adapter, through a WebSocket bridge app running on this phone (browsers can't open raw TCP).
  function openWifi(url) {
    setMsg('CONNECTING TO BRIDGE…', false, 'wait');
    return new Promise((resolve, reject) => {
      let ws;
      try { ws = new WebSocket(url); } catch (e) { reject(new Error('BAD BRIDGE ADDRESS')); return; }
      ws.binaryType = 'arraybuffer';
      const dec = new TextDecoder();
      let dataCb = () => {}, closeCb = () => {}, opened = false;
      const timer = setTimeout(() => { try { ws.close(); } catch {} reject(new Error('BRIDGE APP NOT RUNNING')); }, 6000);
      ws.onopen = () => {
        opened = true; clearTimeout(timer);
        resolve({
          write: s => ws.send(enc.encode(s)),
          onData: fn => { dataCb = fn; },
          onClose: fn => { closeCb = fn; },
          close: async () => { try { ws.close(); } catch {} }
        });
      };
      ws.onmessage = e => dataCb(typeof e.data === 'string' ? e.data : dec.decode(e.data));
      ws.onclose = () => { clearTimeout(timer); if (!opened) reject(new Error('BRIDGE APP NOT RUNNING')); else closeCb(); };
    });
  }

  const OPEN = { ble: openBle, serial: openSerial, wifi: openWifi };
  let session = null;

  async function stopSession() {
    const s = session; session = null;
    if (!s) return;
    s.active = false;
    if (s.stop) s.stop();
    if (s.t) { const t = s.t; s.t = null; try { await t.close(); } catch {} }
    clearLive(); srcKind = null;
    setMsg('DISCONNECTED', false, 'off');
  }

  async function startSession(kind, handle) {
    await stopSession();
    const s = { active: true }; session = s; srcKind = kind;
    store.set('kind', kind);
    if (kind === 'gps') { startGps(s); return; }
    while (s.active) {
      let errText = null;
      try {
        s.t = await OPEN[kind](handle);
        if (!s.active) break;
        await runObd(s, s.t);
      } catch (e) {
        errText = (e && e.message ? e.message : String(e)).toUpperCase();
        log('!!', errText);
      }
      if (s.t) { const t = s.t; s.t = null; try { await t.close(); } catch {} }
      clearLive();
      if (!s.active) break;
      for (let i = 5; i > 0 && s.active; i--) {
        setMsg(`${errText || 'CONNECTION LOST'} · RETRY ${i}`, true, 'wait');
        await sleep(1000);
      }
    }
  }

  function startGps(s) {
    if (!navigator.geolocation) { setMsg('NO GPS IN THIS BROWSER', true, 'off'); return; }
    setMsg('GPS – WAITING FOR SIGNAL', false, 'wait');
    const id = navigator.geolocation.watchPosition(p => {
      if (!s.active) return;
      S.speed = p.coords.speed === null ? null : p.coords.speed * 3.6;
      message = `GPS ±${Math.round(p.coords.accuracy)} m · SPEED ONLY`; messageErr = false; linkState = 'ok';
    }, e => {
      S.speed = null;
      setMsg(e.code === 1 ? 'GPS PERMISSION DENIED' : 'GPS – NO SIGNAL', true, 'wait');
    }, { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 });
    s.stop = () => navigator.geolocation.clearWatch(id);
  }

  // ---------- Menu ----------
  const menu = $('menu'), logsheet = $('logsheet');
  const closeMenu = () => menu.classList.remove('open');
  $('b-menu').onclick = () => menu.classList.add('open');
  $('b-close').onclick = closeMenu;
  menu.addEventListener('click', e => { if (e.target === menu) closeMenu(); });

  if (!navigator.serial) { $('c-serial').disabled = true; $('n-serial').textContent = 'Needs Chrome 138 or newer on Android (update Chrome)'; }
  if (!navigator.bluetooth) { $('c-ble').disabled = true; $('n-ble').textContent = 'Needs Chrome, opened from the https:// link'; }

  const pickError = e => {
    if (e && e.name === 'NotFoundError') setMsg('NO ADAPTER CHOSEN', true);
    else setMsg(((e && e.message) || String(e)).toUpperCase(), true);
  };
  $('c-serial').onclick = async () => {
    closeMenu();
    try {
      const port = await navigator.serial.requestPort({ allowedBluetoothServiceClassIds: [SPP] });
      startSession('serial', port); keepAwake();
    } catch (e) { pickError(e); }
  };
  $('c-ble').onclick = async () => {
    closeMenu();
    try {
      const dev = await navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: BLE_SERVICES });
      store.set('bleId', dev.id);
      startSession('ble', dev); keepAwake();
    } catch (e) { pickError(e); }
  };
  $('c-wifi').onclick = () => {
    closeMenu();
    const url = prompt('Bridge address (from the guide):', store.get('wsUrl', 'ws://127.0.0.1:35001'));
    if (!url) return;
    store.set('wsUrl', url.trim());
    startSession('wifi', url.trim()); keepAwake();
  };
  $('c-gps').onclick = () => { closeMenu(); startSession('gps'); keepAwake(); };
  $('c-off').onclick = () => { closeMenu(); store.set('kind', null); stopSession(); };

  const showUnits = () => { $('b-units').textContent = 'Units: ' + (units === 'mph' ? 'mph / °F' : 'km/h / °C'); };
  $('b-units').onclick = () => {
    units = units === 'mph' ? 'kmh' : 'mph'; store.set('units', units);
    speed.build(speedOpts()); showUnits(); evic();
  };
  showUnits();

  const showDim = () => {
    $('app').classList.remove('dim1', 'dim2');
    if (dim) $('app').classList.add('dim' + dim);
    $('b-dim').textContent = 'Brightness: ' + ['Day', 'Dusk', 'Night'][dim];
  };
  $('b-dim').onclick = () => { dim = (dim + 1) % 3; store.set('dim', dim); showDim(); };
  showDim();

  $('b-full').onclick = async () => {
    closeMenu();
    try { if (!document.fullscreenElement) await document.documentElement.requestFullscreen(); else await document.exitFullscreen(); } catch {}
    try { await screen.orientation.lock('landscape'); } catch {}
    keepAwake();
  };

  $('b-log').onclick = () => { closeMenu(); showLog(); logsheet.classList.add('open'); };
  $('b-logclose').onclick = () => logsheet.classList.remove('open');
  $('b-copy').onclick = async () => {
    try { await navigator.clipboard.writeText(LOG.join('\n')); $('b-copy').textContent = 'Copied ✓'; }
    catch { $('b-copy').textContent = 'Copy failed – screenshot instead'; }
    setTimeout(() => { $('b-copy').textContent = 'Copy log'; }, 2000);
  };

  // Keep the screen on while the dashboard is open.
  let wakeLock = null;
  async function keepAwake() {
    try {
      if (!wakeLock && navigator.wakeLock) {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      }
    } catch {}
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });
  document.addEventListener('click', keepAwake, { once: true });

  // ---------- Reconnect to the last adapter automatically ----------
  async function autoConnect() {
    const kind = store.get('kind', null);
    try {
      if (kind === 'serial' && navigator.serial) {
        const ports = await navigator.serial.getPorts();
        if (ports.length) return startSession('serial', ports[0]);
      } else if (kind === 'ble' && navigator.bluetooth && navigator.bluetooth.getDevices) {
        const devs = await navigator.bluetooth.getDevices();
        const d = devs.find(x => x.id === store.get('bleId', '')) || devs[0];
        if (d) return startSession('ble', d);
      } else if (kind === 'wifi') {
        return startSession('wifi', store.get('wsUrl', 'ws://127.0.0.1:35001'));
      } else if (kind === 'gps') {
        return startSession('gps');
      }
    } catch (e) { log('!!', 'auto-connect: ' + e.message); }
    setMsg(kind ? 'TAP MENU › CONNECT' : 'TAP MENU TO CONNECT', false, 'off');
  }
  setTimeout(autoConnect, 2300);

  // Works offline (e.g. when the phone is on the adapter's Wi-Fi with no internet).
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
